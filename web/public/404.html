<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting&hellip;</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a deep link or refresh
      // on a client-side route 404s. This is the standard SPA workaround
      // (rafgraham/spa-github-pages): encode the intended path into the
      // query string behind a lone "/" marker, redirect to the app root,
      // and index.html's inline script decodes it back with
      // history.replaceState before React mounts. pathSegmentsToKeep = 1
      // matches the /all-aboard-planning/ base path.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
